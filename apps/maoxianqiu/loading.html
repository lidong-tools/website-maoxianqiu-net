<style>
.loading-container {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  color: var(--rainbow-color);
  user-select: none;
  background-color: oklch(var(--background));
}

.loading-container *::before,
.loading-container *::after {
  box-sizing: content-box;
}

/* From Uiverse.io by AbanoubMagdy1 */
.loading-container .loader {
  --dim: 3rem;
  width: var(--dim);
  height: var(--dim);
  position: relative;
  animation: spin988 2s linear infinite;
}

.loading-container .loader .circle {
  --color: oklch(var(--primary));
  --dim: 1.2rem;
  width: var(--dim);
  height: var(--dim);
  background-color: var(--color);
  border-radius: 50%;
  position: absolute;
}

.loading-container .loader .circle:nth-child(1) {
  top: 0;
  left: 0;
}

.loading-container .loader .circle:nth-child(2) {
  top: 0;
  right: 0;
}

.loading-container .loader .circle:nth-child(3) {
  bottom: 0;
  left: 0;
}

.loading-container .loader .circle:nth-child(4) {
  bottom: 0;
  right: 0;
}

@keyframes spin988 {
  0% {
    transform: scale(1) rotate(0);
  }

  20%, 25% {
    transform: scale(1.3) rotate(90deg);
  }

  45%, 50% {
    transform: scale(1) rotate(180deg);
  }

  70%, 75% {
    transform: scale(1.3) rotate(270deg);
  }

  95%, 100% {
    transform: scale(1) rotate(360deg);
  }
}

.loading-container .name {
  position: relative;
  margin-top: 20px;
  font-size: 24px;
  line-height: 1.5;
}

.loading-container .tips {
  position: relative;
  margin-top: 10px;
  font-size: 16px;
  opacity: 0.5;
  line-height: 1.5;
}

.loading-container .tips::after {
  position: absolute;
  padding-left: 5px;
  content: "…";
}
</style>

<div class="loading-container">
  <!-- From Uiverse.io by AbanoubMagdy1 -->
  <div class="loader">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>
  <div class="name">%VITE_APP_TITLE%</div>
  <div class="tips">载入中</div>
</div>
